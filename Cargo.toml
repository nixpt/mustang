[package]
name = "arniko-mustang"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
authors = ["The Exosphere Authors"]
description = "Mustang: GPU-Accelerated Effect Compositor for Exosphere"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nixpt/mustang"
repository = "https://github.com/nixpt/mustang"
categories = ["gui", "rendering"]
keywords = ["gpu", "vello", "compositor", "effects", "ui"]
readme = "README.md"
# Ship the library and its examples only (not .dejavue/, CI, scripts or agent docs).
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "mustang"

[features]
default = []
gpu = ["dep:anyrender", "dep:anyrender_vello", "dep:wgpu", "dep:kurbo", "dep:peniko", "dep:vello", "dep:bytemuck", "dep:pollster"]
# animation = easing + engine. The JS animation runtime is the separate opt-in
# `js` feature: boa_engine 0.22 pins icu_normalizer ~2.3, compatible with
# parley's ^2.1.1 (boa 0.21's ~2.0.0 was the conflict that deferred it).
animation = []
# `js` needs Rust 1.91+ (boa_engine 0.22's MSRV); everything else needs 1.88.
js = ["animation", "dep:boa_engine"]
full = ["gpu", "animation"]

[dependencies]
anyhow = "1.0"
boa_engine = { version = "0.22", optional = true }
tracing = "0.1"

[dependencies.anyrender]
version = "0.7"
optional = true

# nixpt/bliss-engine's fork of anyrender_vello (lib name stays `anyrender_vello`),
# so mustang and bliss share one VelloScenePainter/VelloWindowRenderer type
# instead of mixing upstream DioxusLabs anyrender_vello 0.7 with the fork.
[dependencies.anyrender_vello]
package = "bliss-anyrender-vello"
version = "0.3"
optional = true

[dependencies.vello]
version = "0.7"
optional = true

[dependencies.wgpu]
version = "27"
optional = true

[dependencies.kurbo]
version = "0.13"
optional = true

[dependencies.peniko]
version = "0.6"
optional = true

# GPU-compute engine helpers (optional — enabled by the `gpu` feature only).
# All three are already transitive deps of the gpu path (bytemuck via vello,
# pollster via anyrender_vello, naga via wgpu); declaring them optional keeps
# the default (no-gpu) build dep-free.
[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dev-dependencies]
tokio-test = "0.4"
png = "0.17"
# WGSL validation for the color-math kernel — runs in CI without any GPU
# hardware (same naga that wgpu itself uses).
naga = { version = "27", features = ["wgsl-in"] }

# The blur example only has a `main` with the gpu feature.
[[example]]
name = "blur"
required-features = ["gpu"]
